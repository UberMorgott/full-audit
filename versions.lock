# versions.lock — single source of truth for pinned tool versions (maintainer-facing).
# NOT fetched by the audit skill at runtime. Updated via scripts/check_versions.py + .github/workflows/version-check.yml.
# Version pins are duplicated inline across *.md; this file mirrors tools.md (the canonical source).
#
# ecosystem values understood by the checker: npm | pypi | go | cargo | choco | nuget | maven
#   - choco and maven have no clean queryable JSON API here -> the checker marks them "manual".
# security_hold: present -> the checker NEVER flags the tool as behind for versions inside the
#   hold range; it only flags once latest >= the stated safe-resume version.
tools:

  # ---- npm ----
  - name: knip
    ecosystem: npm
    version: 6.14.2
    install_id: knip
    files: [tools.md, README.md, frontend.md, universal.md]
  - name: purgecss
    ecosystem: npm
    version: 8.0.0
    install_id: purgecss
    files: [tools.md, README.md, frontend.md]
  - name: i18n-unused
    ecosystem: npm
    version: 0.19.0
    install_id: i18n-unused
    files: [tools.md, README.md, frontend.md]
  - name: i18next-cli
    ecosystem: npm
    version: 1.58.1
    install_id: i18next-cli
    files: [tools.md]
  - name: dotenv-check
    ecosystem: npm
    version: 1.0.4
    install_id: dotenv-check
    note: "unmaintained — docs recommend replacing with dotenv-linter (cargo); pin kept for traceability"
    files: [tools.md]
  - name: vue-tsc
    ecosystem: npm
    version: 3.3.2
    install_id: vue-tsc
    files: [tools.md, frontend.md]
  - name: license-checker-evergreen
    ecosystem: npm
    version: 6.3.1
    install_id: license-checker-evergreen
    files: [tools.md, README.md, frontend.md, universal.md]
  - name: npm-check-updates
    ecosystem: npm
    version: 22.2.1
    install_id: npm-check-updates
    files: [tools.md]
  - name: snyk
