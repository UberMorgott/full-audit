  # ---- choco (no clean JSON API -> checker marks "manual", does not fail run) ----
  - name: trivy
    ecosystem: choco
    version: 0.69.3
    install_id: trivy
    security_hold: "v0.69.4-0.69.6 compromised (supply-chain) — do NOT bump until 0.70.0"
