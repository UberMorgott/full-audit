  - name: syft
    ecosystem: choco
    version: 1.42.4
    install_id: syft
    note: "community choco pkg lags upstream (e.g. 1.44.0); Anchore signed release binary preferred for high assurance"
    files: [tools.md, universal.md]
  - name: mingw
