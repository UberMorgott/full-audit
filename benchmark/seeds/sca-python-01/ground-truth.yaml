# Ground truth for seed sca-python-01 (controlled SCA, pinned-vulnerable-by-design).
#
# ORACLE: osv.dev /v1/query per pinned package@version (raw responses captured in
#   the F0 report). Each item = one DISTINCT CVE id osv.dev reports as affecting that
#   pinned version. GHSA/PYSEC advisories sharing a CVE alias are deduplicated to that
#   CVE (SCA matches on CVE per the frozen rule). cvss = CVSS v3.x base score from the
#   osv record when present; when the osv record carried only a CVSS v4 vector + a
#   database_specific severity band, cvss is omitted and `severity` (the osv band) is
#   used via the crosswalk in ground-truth.schema.md.
#
# type=sca for every item; file/line_start are advisory only (the SCA matcher ignores
#   them) and point at the package's line in requirements.txt.
#
# CVE-LESS osv advisories for these versions (documented EXPECTED-FN, not matchable by
#   the CVE rule, so intentionally NOT listed as items):
