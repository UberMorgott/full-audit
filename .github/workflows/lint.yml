name: lint-docs

# Maintainer-facing self-test / CI linter for the full-audit skill docs.
# Runs scripts/lint_docs.py against the markdown prompt playbooks to catch the
# bug classes that historically slipped through by hand: broken cross-refs,
# unbalanced code fences, README/CHANGELOG version mismatch, malformed tables,
# and version-pin drift between versions.lock and the inline doc pins.
# Read-only check — it never edits the docs.

on:
  push:
  pull_request:

permissions:
  contents: read   # read-only: this job only inspects the tree, no writes needed

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      # SHA pinning note: for strict supply-chain hardening these actions SHOULD be
      # pinned to a full commit SHA rather than a moving major tag. Major tags (@v4/@v5)
      # are accepted here because this is an internal, read-only maintainer check with
      # no access to secrets.
      - name: Checkout
        uses: actions/checkout@v4   # TODO supply-chain: pin to commit SHA

      - name: Set up Python
        uses: actions/setup-python@v5   # TODO supply-chain: pin to commit SHA
        with:
          python-version: "3.12"

      - name: Lint skill docs (stdlib-only; exits 1 on any ERROR)
        run: python scripts/lint_docs.py
